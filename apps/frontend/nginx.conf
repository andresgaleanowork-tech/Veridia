events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  upstream api {
    server api:3456;
  }

  # No revelar la versión de nginx en las respuestas ni en las páginas de error.
  server_tokens off;

  server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (CSP, HSTS, X-Frame-Options...). Ojo: hay que
    # repetir el include en cada location que declare su propio add_header,
    # porque nginx no hereda las cabeceras del padre en ese caso.
    include /etc/nginx/security-headers.conf;

    # Health check
    location /health {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # API proxy
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
      include /etc/nginx/security-headers.conf;
    }

    # Static assets with cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # SPA fallback
    location / {
      # El HTML nunca se cachea: apunta a assets con hash y debe reflejar el
      # último despliegue de inmediato.
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
