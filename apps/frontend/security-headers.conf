# Cabeceras de seguridad compartidas.
#
# Va en un fichero aparte por una particularidad de nginx: las directivas
# `add_header` NO se heredan si el bloque hijo declara su propio `add_header`.
# La location de assets estáticos añade `Cache-Control`, así que sin este
# include perdería todas las cabeceras de seguridad del bloque `server`.
# Incluyéndolo en cada location, todas las respuestas las llevan.

# La app es una SPA que solo habla con su propio origen: las llamadas van a
# /api/*, que este mismo nginx pasa al backend. Por eso connect-src 'self'
# basta y no hay que autorizar dominios externos.
#
# 'unsafe-inline' en style-src es necesario mientras haya estilos en línea
# (Tailwind en runtime, atributos style de componentes). NO se pone en
# script-src: el bundle es un único fichero externo con hash en el nombre.
#
# frame-ancestors solo funciona por cabecera HTTP (el navegador lo ignora si la
# política llega por <meta>), que es la razón principal de servir la CSP aquí.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Se desactivan APIs del navegador que la app no usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS: solo tiene efecto sobre HTTPS; el navegador la ignora en HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
