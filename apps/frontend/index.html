<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Veridia" />
    <meta name="description" content="Veridia HealthTech — ERP de nutrición clínica" />
    <meta name="application-name" content="Veridia HealthTech" />
    <meta name="format-detection" content="telephone=no" />
    <!--
      CSP de respaldo (meta). La cabecera real la envía nginx en producción
      (apps/frontend/nginx.conf), que es la que manda: frame-ancestors y
      report-* se ignoran cuando la política llega por <meta>.

      Sin 'nonce' a propósito: Vite genera un único <script> externo con hash en
      el nombre, así que no hay scripts inline que autorizar. Un nonce fijado en
      tiempo de build sería el mismo para todos los usuarios y no aportaría
      seguridad, solo la apariencia de tenerla.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor://localhost https://localhost; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: capacitor:; font-src 'self' data:; connect-src 'self' https: capacitor: http://localhost; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Veridia HealthTech" />
    <meta property="og:description" content="ERP de nutrición clínica" />
    <meta property="og:locale" content="es_ES" />
    <title>Veridia HealthTech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
