# ============================================================
# Veridia HealthTech — Nginx Configuration
# Production serving for the React SPA + API proxy
# Compatible with nginx:alpine (standard modules)
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------
    # Logging
    # -----------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/x-javascript
        image/svg+xml
        image/x-icon;

    # -----------------------------------------------------------
    # Upstream: Backend API
    # -----------------------------------------------------------
    upstream api_backend {
        server api:3456;
        keepalive 32;
    }

    # -----------------------------------------------------------
    # Main server
    # -----------------------------------------------------------
    server {
        listen 5173 default_server;
        listen [::]:5173 default_server;
        server_name _;

        # Root: static assets from Vite build
        root /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------
        # Health check endpoint (for Docker HEALTHCHECK)
        # -----------------------------------------------------------
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------
        # API proxy: forward /api/* to the backend service
        # -----------------------------------------------------------
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Pass through important headers
            proxy_pass_request_headers on;
        }

        # -----------------------------------------------------------
        # Static assets: long-term caching
        # -----------------------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -----------------------------------------------------------
        # Favicon / manifest / icons
        # -----------------------------------------------------------
        location ~* (favicon|manifest|icons)\.(svg|ico|json|png)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # -----------------------------------------------------------
        # SPA fallback: serve index.html for all non-API routes
        # -----------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------------------------
        # Security headers
        # -----------------------------------------------------------
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Hide Nginx version in error pages and server header
        server_tokens off;
    }
}