version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    open-pull-requests-limit: 10
    reviewers:
      - "veridia-team"
    assignees:
      - "veridia-team"
    groups:
      drizzle:
        patterns:
          - "drizzle*"
        update-types:
          - "minor"
          - "patch"
      express:
        patterns:
          - "express*"
        update-types:
          - "minor"
          - "patch"
      security:
        patterns:
          - "helmet"
          - "cors"
          - "bcrypt"
          - "jsonwebtoken"
          - "zod"
        update-types:
          - "minor"
          - "patch"
      test:
        patterns:
          - "vitest"
          - "@testing-library*"
          - "tsx"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    open-pull-requests-limit: 10
    reviewers:
      - "veridia-team"
    assignees:
      - "veridia-team"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      tailwind:
        patterns:
          - "tailwind*"
          - "@tailwindcss*"
        update-types:
          - "minor"
          - "patch"
      ui:
        patterns:
          - "@radix-ui*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      test:
        patterns:
          - "vitest"
          - "@testing-library*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      build:
        patterns:
          - "vite*"
          - "typescript"
          - "eslint*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 5