name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# Pasos comunes de instalación (caché de store de pnpm vía setup-node)
jobs:
  # ---------- Lint (0 warnings tolerados) ----------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version desde packageManager (package.json)
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter veridia-app lint
      - name: Lint backend (max-warnings 0)
        run: pnpm --filter @veridia/backend exec eslint src --ext .ts --max-warnings 0

  # ---------- TypeCheck ----------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check frontend
        run: pnpm --filter veridia-app exec tsc -b
      - name: Type check backend
        run: pnpm --filter @veridia/backend exec tsc --noEmit

  # ---------- Build ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (frontend + backend)
        run: pnpm build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

  # ---------- Tests unitarios / componente ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests (frontend + backend)
        run: pnpm test

  # ---------- E2E (Playwright + PostgreSQL real) ----------
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veridia_db
          POSTGRES_USER: veridia
          POSTGRES_PASSWORD: veridia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veridia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://veridia:veridia_ci@localhost:5432/veridia_db
      JWT_SECRET: ci-e2e-jwt-secret-ci-e2e-jwt-secret-ci-e2e-jwt-secret=
      JWT_REFRESH_SECRET: ci-e2e-jwt-refresh-ci-e2e-jwt-refresh-ci-e2e-jwt=
      NODE_ENV: test
      VITE_PROXY_TARGET: http://localhost:3456
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply schema (Drizzle)
        run: pnpm --filter @veridia/backend db:push
      - name: Seed datos
        run: pnpm --filter @veridia/backend db:seed
      - name: Build + start API
        run: |
          pnpm --filter @veridia/backend build
          PORT=3456 nohup node apps/backend/dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3456/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3456/api/health || (echo "API no arrancó:"; cat /tmp/api.log; exit 1)
      - name: Install Playwright browser
        run: pnpm --filter veridia-app exec playwright install chromium --with-deps
      - name: Run E2E
        run: pnpm --filter veridia-app e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 14
      - name: API logs (failure)
        if: failure()
        run: cat /tmp/api.log
