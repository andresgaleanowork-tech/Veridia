name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Lint backend
        run: npm run lint
        working-directory: apps/backend

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: apps/frontend

  typecheck-backend:
    name: Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/backend

  typecheck-frontend:
    name: Type Check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, typecheck-backend, typecheck-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Run tests
        run: npm test
        working-directory: apps/backend

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, typecheck-backend, typecheck-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Run tests
        run: npm run test:run
        working-directory: apps/frontend

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Build
        run: npm run build
        working-directory: apps/backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Build
        run: npm run build
        working-directory: apps/frontend

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo ":rocket: Deploying to staging..."
          # Add your staging deployment commands here
      - name: Health check
        run: |
          sleep 10
          curl -f https://staging-api.veridia.tech/api/health || exit 1
