name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Lint backend
        run: npm run lint
        working-directory: apps/backend

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: apps/frontend

  typecheck-backend:
    name: Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/backend

  typecheck-frontend:
    name: Type Check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: TypeScript check
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, typecheck-backend, typecheck-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Run tests
        run: npm test
        working-directory: apps/backend

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, typecheck-backend, typecheck-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Run tests
        run: npm run test:run
        working-directory: apps/frontend

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/backend
      - name: Build
        run: npm run build
        working-directory: apps/backend
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/frontend
      - name: Build
        run: npm run build
        working-directory: apps/frontend
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
      # El despliegue real todavia no esta conectado: el paso "Deploy to server"
      # era un placeholder vacio y aun asi se hacia un health check contra
      # https://api.veridia.tech, que nadie habia desplegado. Resultado: este
      # workflow fallaba en el 100% de las ejecuciones y dejaba main en rojo
      # aunque lint, typecheck, tests y ambos builds estuvieran en verde.
      #
      # Ahora el despliegue solo se ejecuta si hay un destino configurado. Para
      # activarlo basta con definir la variable de repositorio
      # PRODUCTION_HEALTHCHECK_URL (Settings > Secrets and variables > Actions
      # > Variables) y rellenar el paso de despliegue con el comando real.
      - name: Comprobar si hay destino de despliegue configurado
        id: target
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue omitido::No hay PRODUCTION_HEALTHCHECK_URL configurada. Los artefactos se han construido y subido correctamente; define esa variable de repositorio cuando exista el servidor de produccion."
          fi

      - name: Deploy to server
        if: steps.target.outputs.configured == 'true'
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment commands here
          # Example: rsync, docker push, kubectl apply, etc.

      - name: Health check
        if: steps.target.outputs.configured == 'true'
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          # Un solo curl justo despues de desplegar es una carrera: el proceso
          # puede seguir arrancando. Se reintenta con espera entre intentos.
          for intento in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL"; then
              echo "✅ Health check OK en el intento $intento"
              exit 0
            fi
            echo "Intento $intento fallido; reintentando en 10s..."
            sleep 10
          done
          echo "❌ El health check no respondio tras 5 intentos"
          exit 1
